# Remplace "ophtacare-xxxx" par le nom que tu choisiras lors du `fly launch`
app            = "ophtacare-xxxx"
primary_region = "cdg"          # Paris — le plus proche de l'Afrique de l'Ouest

[build]
  dockerfile = "Dockerfile"

[env]
  APP_TIMEZONE = "Africa/Dakar"

# Secrets à définir avec `fly secrets set` (ne jamais les mettre ici) :
#   APP_KEY  → résultat de `php artisan key:generate --show`
#   APP_URL  → https://<nom-app>.fly.dev

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false   # ne jamais s'endormir
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 50
    soft_limit = 25

[[mounts]]
  source      = "ophtacare_data"   # volume créé automatiquement au premier déploiement
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"
