worker_processes auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;
    sendfile     on;
    keepalive_timeout 65;

    # Dossiers temporaires accessibles sans root
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;

    server {
        listen      8080;
        server_name _;
        root        /var/www/public;
        index       index.php index.html;

        # Assets Next.js (immutables — hash dans le nom de fichier)
        location /_next/static/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # Icônes, manifest, sw.js — durée courte pour permettre les mises à jour
        location ~* \.(png|ico|webmanifest|json)$ {
            expires    1d;
            add_header Cache-Control "public";
            try_files  $uri =404;
        }

        # sw.js ne doit jamais être mis en cache par le navigateur
        location = /sw.js {
            add_header Cache-Control "no-store";
            try_files  $uri =404;
        }

        # Tout le reste → Laravel (API + pages SPA)
        location / {
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass            127.0.0.1:9000;
            fastcgi_index           index.php;
            fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_read_timeout    60;
            include                 fastcgi_params;
        }

        # Jamais d'accès aux fichiers cachés
        location ~ /\. {
            deny all;
        }
    }
}
