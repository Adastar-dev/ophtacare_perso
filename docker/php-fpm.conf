[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

; 2 workers fixes suffisent pour un usage mono-utilisateur (~40 Mo chacun)
pm               = static
pm.max_children  = 2
pm.max_requests  = 500

; Logs vers stderr (visibles dans fly logs)
php_admin_flag[log_errors] = on
php_admin_value[error_log]  = /dev/stderr
